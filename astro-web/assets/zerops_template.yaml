zerops:
  # =========================================================================
  # PRODUCTION SETUP: ASTRO 5 SSR STANDALONE ON BUN 1.3.9
  # =========================================================================
  - setup: prod
    build:
      base: ubuntu/bun@1.3.9
      envVariables:
        BUN_INSTALL: ./.bun
      buildCommands:
        - bun install --frozen-lockfile
        - bun run build
      deployFiles:
        - dist
        - node_modules
        - package.json
      cache:
        - node_modules
        - .bun/install/cache

    deploy:
      temporaryShutdown: false
      readinessCheck:
        httpGet:
          port: 3000
          path: /

    run:
      base: ubuntu/bun@1.3.9
      ports:
        - port: 3000
          httpSupport: true
      start: bun run ./dist/server/entry.mjs
      envVariables:
        NODE_ENV: production
        HOST: "0.0.0.0"
        PORT: "3000"
        PUBLIC_SITE_URL: ${zeropsSubdomain}
        ASTRO_KEY: ${ASTRO_KEY}
        
        # Managed Service Connections (Injected via Zerops Platform)
        DATABASE_URL: ${db_connectionString}
        VALKEY_URL: ${cache_connectionString}
        NATS_URL: ${queue_connectionString}
        
        # S3 Object Storage Credentials
        S3_ENDPOINT: ${storage_apiUrl}
        S3_ACCESS_KEY: ${storage_accessKeyId}
        S3_SECRET_KEY: ${storage_secretAccessKey}
        S3_BUCKET: ${storage_bucketName}
      healthCheck:
        httpGet:
          port: 3000
          path: /

  # =========================================================================
  # DEVELOPMENT SETUP: INTERACTIVE WORKSPACE
  # =========================================================================
  - setup: dev
    build:
      base: ubuntu/bun@1.3.9
      envVariables:
        BUN_INSTALL: ./.bun
      buildCommands:
        - bun install
      deployFiles:
        - .
      cache:
        - node_modules
        - .bun/install/cache

    run:
      base: ubuntu/bun@1.3.9
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: development
        HOST: "0.0.0.0"
        PORT: "3000"
        BUN_INSTALL: /var/www/.bun
        VALKEY_URL: ${cache_connectionString}
        NATS_URL: ${queue_connectionString}
        DATABASE_URL: ${db_connectionString}
        ASTRO_KEY: ${ASTRO_KEY}
      start: zsc noop --silent
