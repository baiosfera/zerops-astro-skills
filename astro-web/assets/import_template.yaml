#zeropsPreprocessor=on
project:
  name: app-astro-suite
  corePackage: LIGHT
  envVariables:
    ASTRO_KEY: <@generateRandomString(<32>)|sha256>

services:
  # ==========================================
  # ASTRO 5 SSR RUNTIME (BUN 1.3.9 ON UBUNTU)
  # ==========================================
  - hostname: web
    type: ubuntu/bun@1.3.9
    priority: 5
    enableSubdomainAccess: true
    startWithoutCode: true
    minContainers: 1
    maxContainers: 3
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 4
      minRam: 0.25
      maxRam: 2.0
      minDisk: 1.0
      maxDisk: 10.0

  # ==========================================
  # NATS JETSTREAM 2.12 (EVENT BUS & RPC)
  # ==========================================
  - hostname: queue
    type: nats:single@2.12
    priority: 10
    verticalAutoscaling:
      cpuMode: SHARED

  # ==========================================
  # VALKEY 7.2 (CACHE & RATE LIMITING)
  # ==========================================
  - hostname: cache
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  # ==========================================
  # POSTGRESQL 18 (MANAGED DATABASE)
  # ==========================================
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10

  # ==========================================
  # S3 OBJECT STORAGE (MEDIA & ASSETS)
  # ==========================================
  - hostname: storage
    type: object-storage
    objectStorageSize: 10
    priority: 10
