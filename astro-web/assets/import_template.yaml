#zeropsPreprocessor=on
project:
  name: gentle-astro-suite
  corePackage: LIGHT
  envVariables:
    ASTRO_KEY: <@generateRandomString(<32>)|sha256>

services:
  # ==========================================
  # ASTRO 5 SSR RUNTIME (BUN 1.3.9)
  # ==========================================
  - hostname: astroapp
    type: bun@1.3.9
    priority: 5
    enableSubdomainAccess: true
    startWithoutCode: true
    minContainers: 1
    maxContainers: 4
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 4
      minRam: 0.25
      maxRam: 2.0
      minDisk: 1.0
      maxDisk: 10.0
    mount:
      - storage

  # ==========================================
  # VALKEY 7.2 (SSR FRAGMENT CACHE)
  # ==========================================
  - hostname: cache
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  # ==========================================
  # SHARED POSIX STORAGE (PERSISTENT CACHE)
  # ==========================================
  - hostname: storage
    type: shared-storage:single
    priority: 10
    verticalAutoscaling:
      minDisk: 5.0
      maxDisk: 50.0
