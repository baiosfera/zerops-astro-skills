zerops:
  - setup: prod
    build:
      base: nodejs@24
      os: ubuntu
      envVariables:
        npm_config_cache: .npm-cache
      buildCommands:
        - npm ci --prefer-offline
        - npm run build
        - npm prune --omit=dev
      deployFiles:
        - ./dist
        - ./node_modules
        - ./package.json
      cache:
        - node_modules
        - .npm-cache

    deploy:
      readinessCheck:
        httpGet:
          port: 3000
          path: /health

    run:
      base: nodejs@24
      os: ubuntu
      initCommands:
        # Migración atómica segura ejecutada exactamente una vez por release
        - zsc execOnce ${appVersionId} --retryUntilSuccessful -- npm run db:migrate
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        NODE_ENV: production
        DB_HOST: db
        DB_PORT: ${db_port}
        DB_NAME: ${db_dbName}
        DB_USER: ${db_user}
        DB_PASSWORD: ${db_password}
        DATABASE_URL: postgresql://${db_user}:${db_password}@db:${db_port}/${db_dbName}
        # Conexión balanceada a réplicas de lectura (solo en :ha)
        DATABASE_READ_REPLICA_URL: postgresql://${db_user}:${db_password}@db:${db_portReplicas}/${db_dbName}
      start: node dist/index.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health
