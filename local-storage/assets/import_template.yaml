#zeropsPreprocessor=on
project:
  name: gentle-local-storage-suite
  corePackage: LIGHT

services:
  # ==========================================
  # LOCAL STORAGE MANAGED SERVICE
  # ==========================================
  - hostname: storage
    type: local-storage:single@1
    priority: 10 # Bootstrapped before consumer runtime services
    verticalAutoscaling:
      cpuMode: SHARED
      minCpu: 1
      maxCpu: 2
      minRam: 0.5
      maxRam: 1.0
      minDisk: 10.0
      maxDisk: 100.0

  # ==========================================
  # CONSUMER BACKEND RUNTIME (NODE.JS)
  # ==========================================
  - hostname: backend
    type: nodejs@24
    priority: 5
    enableSubdomainAccess: true
    startWithoutCode: true
    verticalAutoscaling:
      minCpu: 1
      maxCpu: 4
      minRam: 0.5
      maxRam: 2.0

  # ==========================================
  # CONSUMER FRONTEND RUNTIME (BUN / ASTRO)
  # ==========================================
  - hostname: frontend
    type: bun@1.3.9
    priority: 5
    enableSubdomainAccess: true
    startWithoutCode: true
    verticalAutoscaling:
      minCpu: 1
      maxCpu: 4
      minRam: 0.25
      maxRam: 2.0
