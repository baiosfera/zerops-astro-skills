zerops:
  - setup: prod
    build:
      base: nodejs@24
      os: ubuntu
      buildCommands:
        - npm ci --prefer-offline
        - npm run build
      deployFiles:
        - ./dist
        - ./node_modules
        - ./package.json

    run:
      base: nodejs@24
      os: ubuntu
      # ==========================================
      # LOCAL STORAGE PERSISTENT VOLUME MOUNT
      # ==========================================
      volume:
        hostname: storage
        mountPath: /mnt/storage
        readOnly: false

      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        PORT: 3000
        NODE_ENV: production
        DATA_PATH: /mnt/storage/backend/data.db
        UPLOADS_PATH: /mnt/storage/backend/uploads
      start: node dist/index.js
      healthCheck:
        httpGet:
          port: 3000
          path: /health
