#zeropsPreprocessor=on
project:
  name: gentle-ecosystem
  corePackage: LIGHT # Use LIGHT for dev/stage, SERIOUS for multi-container HA production
  envVariables:
    SHARED_JWT_SECRET: "<@generateRandomString(32)|hex>"
    PUBLIC_CDN_URL: "${storageCdnUrl}"

services:
  # Runtime Service (Autonomous Elastic Autoscaling by Zerops)
  - hostname: appdev
    type: bun@1.3.9
    priority: 5
    startWithoutCode: true
    enableSubdomainAccess: true

  # Primary Managed PostgreSQL Database
  - hostname: db
    type: postgresql:single@18
    profile: oltp-hobby
    priority: 10

  # High-Performance In-Memory Cache
  - hostname: cache
    type: valkey:single@7.2
    profile: hobby
    priority: 10

  # Asynchronous Message Queue & Event Stream
  - hostname: queue
    type: nats:single@2.12
    priority: 10

  # Local Storage (Persistent Disk Volume)
  - hostname: storage
    type: local-storage:single@1
    priority: 10
