name: Skills Suite CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md Frontmatter, Word Budget (<= 480) & Zero-Leak Hygiene
        run: |
          python3 - << 'EOF'
          import pathlib
          import re
          import sys

          errors = []
          warnings = []
          for skill_md in sorted(pathlib.Path(".").glob("*/SKILL.md")):
              text = skill_md.read_text(encoding="utf-8")
              if not text.startswith("---\n"):
                  errors.append(f"{skill_md}: missing YAML frontmatter")
                  continue
              parts = text.split("\n---\n", 1)
              if len(parts) != 2:
                  errors.append(f"{skill_md}: unclosed YAML frontmatter")
                  continue
              fm, body = parts
              if "name:" not in fm or "description:" not in fm:
                  errors.append(f"{skill_md}: frontmatter missing name or description")
              words = len(body.split())
              if words > 480:
                  warnings.append(f"::warning file={skill_md}::body exceeds 480 words ({words})")
              if ".ny1.zerops.app" in text:
                  errors.append(f"{skill_md}: contains hardcoded .ny1.zerops.app URL")

          if warnings:
              print("\n".join(warnings))
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print(f"Skills frontmatter & zero-leak CI passed ({len(warnings)} word-budget warnings).")
          EOF
