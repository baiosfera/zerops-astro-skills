# Production Zerops Topology for Node.js Application Stack
# Demonstrates native elastic autoscaling without manual min/max guesswork

project:
  name: nodejs-app

services:
  # Node.js API Service (Incus LXC Container with Native Automatic Vertical Autoscaling)
  - hostname: api
    type: nodejs@22
    enableSubdomainAccess: true

  # Managed PostgreSQL Database
  - hostname: db
    type: postgresql@16:single

  # Managed Valkey Cache
  - hostname: cache
    type: valkey@7.2:single

  # Shared Storage Mount
  - hostname: storage
    type: shared-storage
