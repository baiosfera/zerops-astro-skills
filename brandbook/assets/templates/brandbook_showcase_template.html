<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Showcase SOTA - [MARCA]</title>
  
  <!-- Preconnect & Google Fonts v2 Variable -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="[GOOGLE_FONTS_V2_URL]" rel="stylesheet">
  
  <style>
    :root {
      --color-brand-primary: [OKLCH_PRIMARY];
      --color-brand-secondary: [OKLCH_SECONDARY];
      --color-brand-accent: [OKLCH_ACCENT];
      --color-brand-bg: [OKLCH_BG];
      --color-brand-surface: [OKLCH_SURFACE];
      --color-brand-text: [OKLCH_TEXT];
      --color-brand-muted: [OKLCH_MUTED];
      
      --font-display: '[FONT_DISPLAY]', serif;
      --font-body: '[FONT_BODY]', system-ui, sans-serif;
      --font-accent: '[FONT_ACCENT]', cursive;
    }

    body {
      background-color: var(--color-brand-bg);
      color: var(--color-brand-text);
      font-family: var(--font-body);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .showcase-card {
      max-width: 900px;
      width: 100%;
      background: var(--color-brand-surface);
      border: 1px solid color-mix(in oklch, var(--color-brand-primary) 20%, transparent);
      padding: 3rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: 3rem;
      margin: 0;
      color: var(--color-brand-text);
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 1.25rem;
      color: var(--color-brand-muted);
      margin: 0;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .btn {
      background: var(--color-brand-primary);
      color: #ffffff;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn:hover {
      transform: scale(1.04);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--color-brand-muted);
      color: var(--color-brand-text);
    }
  </style>
</head>
<body>
  <div class="showcase-card" id="showcase-container">
    <div id="brand-logo" style="width: 120px; height: 120px;">
      [SVG_ISOLOGO_PRINCIPAL]
    </div>
    <h1 class="hero-title">[MARCA]</h1>
    <p class="tagline">[TAGLINE_O_SLOGAN]</p>
    
    <div class="button-group">
      <button class="btn" id="btn-interact" onclick="triggerHeroAction()">Micro-Audio ADSR + GSAP</button>
      <button class="btn btn-secondary" onclick="triggerConfirmAction()">Confirmación Háptica</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // Sintetizador Procedural ADSR SOTA (Zero MP3s)
    class BrandAudioSynthesizer {
      constructor() { this.ctx = null; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      play({ type = 'sine', freq = 520, attack = 0.015, decay = 0.04, sustain = 0.2, release = 0.06, gain = 0.04, filterFreq = 3200 } = {}) {
        this.init();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gainNode = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterFreq, now);
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.linearRampToValueAtTime(gain, now + attack);
        gainNode.gain.exponentialRampToValueAtTime(Math.max(0.0001, gain * sustain), now + attack + decay);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + attack + decay + release);

        osc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + attack + decay + release + 0.01);
      }
    }

    const sound = new BrandAudioSynthesizer();

    function triggerHeroAction() {
      sound.play({ type: 'triangle', freq: 740, attack: 0.01, decay: 0.05, sustain: 0.2, release: 0.08, gain: 0.05 });
      gsap.from(".hero-title", { scale: 1.06, duration: 0.4, ease: "back.out(1.7)" });
    }

    function triggerConfirmAction() {
      sound.play({ type: 'sine', freq: 880, attack: 0.01, decay: 0.08, sustain: 0.3, release: 0.15, gain: 0.06 });
      gsap.from("#brand-logo", { rotate: 10, scale: 1.08, duration: 0.5, ease: "elastic.out(1, 0.4)" });
    }

    // Hydration Lock con GSAP Context
    document.fonts.ready.then(() => {
      gsap.from("#showcase-container", { opacity: 0, y: 40, duration: 1, ease: "power3.out" });
    });
  </script>
</body>
</html>
